name: Release

# Pushing a vX.Y.Z tag builds every target and publishes a GitHub release.
# Pull requests that touch this workflow or the dependencies only build, so a
# broken target shows up before a tag is cut.
"on":
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust with the official rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        if: matrix.smoke
        run: |
          line=$(echo '{"workspace":{"current_dir":"/tmp/smoke"}}' | \
            CLAUDE_STATUSLINE_CACHE_DIR="$RUNNER_TEMP/cache" "target/$TARGET/release/claude-code-statusline")
          echo "$line"
          case "$line" in *smoke*) ;; *) exit 1 ;; esac

      - name: Package
        run: tar -czf "claude-code-statusline-$TARGET.tar.gz" -C "target/$TARGET/release" claude-code-statusline

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: claude-code-statusline-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        run: |
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          gh release create "$TAG" dist/* --verify-tag --generate-notes
